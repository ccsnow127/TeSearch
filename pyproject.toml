[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesearch"
version = "1.0.0"
description = "Quality-diversity evolutionary search for size-optimized unit test generation"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "httpx",
    "pyarrow>=14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fetch = ["huggingface_hub>=0.23"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tesearch*"]

[tool.setuptools.package-data]
"tesearch.harness" = ["container/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
